<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140">
  <filter id="paper-grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" stitchTiles="stitch" result="noise" />
    <feColorMatrix type="saturate" values="0" in="noise" result="mono" />
    <feComponentTransfer in="mono">
      <feFuncA type="linear" slope="0.055" intercept="0" />
    </feComponentTransfer>
  </filter>
  <rect width="140" height="140" fill="#2a231c" filter="url(#paper-grain)" opacity="0.5" />
</svg>
