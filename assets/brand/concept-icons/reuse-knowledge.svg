<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <!-- 羽毛渐变 -->
    <linearGradient id="greenFeatherDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="greenFeatherLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D1FAE5" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>
    <!-- 墨水瓶渐变 -->
    <linearGradient id="blueBottleDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="blueBottleLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
    <radialGradient id="inkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 居中平移 -->
  <g transform="translate(150, 170)">
    <!-- 墨水光晕 -->
    <circle cx="0" cy="40" r="50" fill="url(#inkGlow)" />

    <!-- 淡蓝色墨水瓶 -->
    <path d="M -20,30 Q -28,30 -28,45 L -28,52 Q -28,60 -18,60 L 18,60 Q 28,60 28,52 L 28,45 Q 28,30 20,30 Z" fill="url(#blueBottleDark)" />
    <path d="M -18,32 Q -25,32 -25,45 L -25,51 Q -25,58 -15,58 L 15,58 Q 25,58 25,51 L 25,45 Q 25,32 18,32 Z" fill="url(#blueBottleLight)" />
    
    <!-- 瓶口 -->
    <rect x="-12" y="20" width="24" height="12" rx="4" fill="#7DD3FC" />
    <rect x="-14" y="18" width="28" height="4" rx="2" fill="#38BDF8" />
    <rect x="-14" y="18" width="28" height="1.5" rx="0.75" fill="#E0F2FE" opacity="0.8" />
    
    <!-- 瓶身高光 -->
    <path d="M -18,42 Q -18,55 -10,56" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.5" />
    <path d="M -22,48 L 22,48" stroke="#E0F2FE" stroke-width="2" stroke-linecap="round" opacity="0.6" />

    <!-- 淡绿色羽毛笔 -->
    <g transform="rotate(20, 0, 20)">
      <!-- 羽轴 -->
      <path d="M 0,20 Q 5,-20 15,-65" fill="none" stroke="#6EE7B7" stroke-width="3" stroke-linecap="round" />

      <!-- 羽毛底层 -->
      <path d="M 0,10 C -20,0 -30,-30 -20,-60 C -10,-75 5,-65 5,-40 C 5,-20 0,0 0,10 Z" fill="url(#greenFeatherDark)" />
      <path d="M 5,-10 C 25,-20 35,-50 25,-70 C 15,-85 0,-75 0,-50 C 0,-30 5,-15 5,-10 Z" fill="url(#greenFeatherDark)" opacity="0.85" />

      <!-- 羽毛上层高光与羽枝纹理 -->
      <path d="M 0,5 C -15,-5 -22,-25 -15,-45 C -8,-60 2,-55 2,-35 C 2,-20 0,-5 0,5 Z" fill="url(#greenFeatherLight)" />
      <path d="M -2,-10 Q -12,-15 -15,-25" fill="none" stroke="#D1FAE5" stroke-width="1.5" stroke-linecap="round" />
      <path d="M 0,-20 Q -10,-25 -12,-35" fill="none" stroke="#D1FAE5" stroke-width="1.5" stroke-linecap="round" />
      <path d="M 1,-30 Q -5,-35 -8,-45" fill="none" stroke="#D1FAE5" stroke-width="1.5" stroke-linecap="round" />

      <path d="M 5,-5 C 20,-15 28,-35 20,-55 C 12,-70 2,-65 2,-45 C 2,-25 5,-10 5,-5 Z" fill="url(#greenFeatherLight)" opacity="0.9" />
      <path d="M 7,-12 Q 17,-17 20,-27" fill="none" stroke="#D1FAE5" stroke-width="1.5" stroke-linecap="round" />
      <path d="M 6,-22 Q 14,-27 16,-37" fill="none" stroke="#D1FAE5" stroke-width="1.5" stroke-linecap="round" />
      <path d="M 4,-32 Q 10,-37 12,-47" fill="none" stroke="#D1FAE5" stroke-width="1.5" stroke-linecap="round" />

      <!-- 笔尖 -->
      <path d="M 15,-65 Q 15,-72 12,-75 Q 9,-72 15,-65 Z" fill="#34D399" />
      <circle cx="13" cy="-74" r="1.5" fill="#10B981" />
    </g>

    <!-- 墨水飞溅光点 -->
    <circle cx="-25" cy="-5" r="3" fill="#6EE7B7" opacity="0.7" />
    <circle cx="35" cy="10" r="2" fill="#7DD3FC" opacity="0.6" />
    <circle cx="-30" cy="15" r="1.5" fill="#D1FAE5" opacity="0.8" />
    <circle cx="25" cy="-15" r="2" fill="#BAE6FD" opacity="0.7" />
  </g>
</svg>
