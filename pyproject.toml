[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "psych-agent"
version = "0.1.0"
authors = [{ name = "yourname" }]
description = "Psychology Agent FastAPI backend"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "langchain-core==1.4.9",
    "langchain-community==0.4.2",
    "langchain-classic==1.0.8",
    "langchain-deepseek==1.1.0",
    "langchain-openai==1.3.2",
    "langchain-text-splitters==1.1.2",
    "openai==2.43.0",
    "ollama==0.6.2",
    "chromadb==1.5.9",
    "sentence-transformers==6.0.1",
    "rank-bm25==0.2.2",
    "jieba3k==0.35.1",
    "fastapi==0.141.1",
    "uvicorn==0.51.0",
    "sse-starlette==3.4.11",
    "requests==2.32.5",
    "python-dotenv==1.1.0",
    "pydantic==2.12.4"
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "ruff",
    "pytest"
]

[tool.hatch.build.targets.wheel]
packages = [
    "api",
    "config",
    "core",
    "models",
    "store"
]

dev-mode-dirs = ["."]

[tool.hatch.build.targets.wheel.resources]
"config" = ["*.json", "*.j2"]
"models" = ["*.json"]
"store" = ["*.json"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true
